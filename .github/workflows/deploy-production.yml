name: Deploy hotfix to Production

on:
  workflow_dispatch:
  pull_request:
    branches: [version-15]
    types: [closed, labeled]

# The job only opens an SSH session, so the token needs no access.
permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Manual runs deploy only from version-15; PR runs only for a merged PR into version-15 labelled deploy-hotfix.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/version-15') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'deploy-hotfix'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Deploy version-15 to Production
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.PRODUCTION_KEY }}
          port: 22
          command_timeout: 60m
          script_stop: true
          script: |
            set -e
            BENCH=/home/frappe/frappe-bench
            APP_DIR="$BENCH/apps/processa"
            [ -d "$APP_DIR" ] || APP_DIR="$BENCH/apps/one_bpmn"
            # The deploy steps live in the repo, fetched from the branch being deployed.
            git -C "$APP_DIR" fetch upstream version-15
            git -C "$APP_DIR" show FETCH_HEAD:scripts/deploy.sh > "$BENCH/config/deploy.sh"
            bash "$BENCH/config/deploy.sh" "$BENCH" version-15
