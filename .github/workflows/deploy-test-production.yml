name: Deploy CI/CD to Test Production site

on:
  workflow_dispatch:
  push: # tells github to run this on any push to the repository
    branches:
      - test-production

concurrency:
  group: deploy-test-production
  cancel-in-progress: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Deploy to Test Production site
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.STAGING_KEY }}
          port: 22
          command_timeout: 60m
          script: |
            set -e
            BENCH=/home/frappe/test-production
            APP_DIR="$BENCH/apps/processa"
            [ -d "$APP_DIR" ] || APP_DIR="$BENCH/apps/one_bpmn"
            # The deploy steps live in the repo, fetched from the branch being deployed.
            git -C "$APP_DIR" fetch upstream test-production
            git -C "$APP_DIR" show FETCH_HEAD:scripts/deploy.sh > "$BENCH/config/deploy.sh"
            NODE_OPTIONS="--max-old-space-size=4096" bash "$BENCH/config/deploy.sh" "$BENCH" test-production
